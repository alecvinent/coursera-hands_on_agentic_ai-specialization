# nginx reverse-proxy with TLS termination for MCP Portfolio
# Usage:
#   1. Place this file in /etc/nginx/conf.d/ or include it in nginx.conf
#   2. Ensure server.crt and server.key exist at the paths below
#   3. Reload: nginx -s reload

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# --- HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    ssl_certificate     /etc/ssl/certs/server.crt;
    ssl_certificate_key /etc/ssl/private/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- MCP HTTP transport (port 8000) ---
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Ops / health / metrics (port 8001) ---
    location /health {
        proxy_pass http://127.0.0.1:8001/health;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location /metrics {
        proxy_pass http://127.0.0.1:8001/metrics;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        # Restrict to operator network — adjust as needed
        # allow 10.0.0.0/8;
        # deny all;
    }

    location /dashboard {
        proxy_pass http://127.0.0.1:8001/dashboard;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # --- Security headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;

    # --- Access / error logs ---
    access_log /var/log/nginx/mcp-portfolio-access.log;
    error_log  /var/log/nginx/mcp-portfolio-error.log warn;
}

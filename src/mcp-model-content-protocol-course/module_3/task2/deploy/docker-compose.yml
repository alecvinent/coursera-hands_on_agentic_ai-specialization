services:
  mcp-portfolio:
    build:
      context: ../..
      dockerfile: src/mcp-model-content-protocol-course/module_3/task2/deploy/Dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
